name: vita

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes: [redis-data:/data]

  kafka:
    image: apache/kafka:3.8.1
    user: "0:0"
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"
    environment:
      CLUSTER_ID: "vita-cluster-0001"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [kafka-data:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for t in vita.raw.events vita.processed.trajectories vita.actions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "${t}" \
            --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic vita.paradox.quarantine \
          --partitions 1 --replication-factor 1
        echo "topics ready"

  processor:
    build: { context: ., target: runtime }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis:      { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      REDIS_URL: "redis://redis:6379/0"
      VITA_INPUT_TOPIC: "vita.raw.events"
      VITA_OUTPUT_TOPIC: "vita.processed.trajectories"
      VITA_ACTION_TOPIC: "vita.actions"
      VITA_DLQ_TOPIC: "vita.paradox.quarantine"
      VITA_GROUP_ID: "vita-processors-v1"
    command: ["python", "-m", "vita.kafka_consumer"]
    restart: unless-stopped

  processor-dev:
    build: { context: ., target: dev }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis:      { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts

volumes:
  redis-data:
  kafka-data:
